version: '3'

tasks:
  init:dev:
    desc: Create .venv and install project and development dependencies
    cmds:
      - uv sync --locked --group dev

  pytest:
    desc: Run pytest with terminal coverage output
    cmds:
      - uv run --group dev pytest --cov --cov-report=term-missing {{.CLI_ARGS}}

  pytest:coverage:
    desc: Run pytest with branch coverage and terminal, HTML, and XML reports
    cmds:
      - uv run --group dev pytest --cov --cov-report=term-missing --cov-report=html --cov-report=xml {{.CLI_ARGS}}

  update:
    desc: Update packages and pre-commit hooks
    cmds:
      - task: packages:update
      - task: pre-commit:update
  
  fix:
    desc: Apply safe automatic fixes and formatting
    cmds:
      - task: ruff:fix
      - task: ruff:format

  check:
    desc: Run type, lint, and dependency vulnerability checks
    cmds:
      - task: ty
      - task: ruff:check
      - task: uv:audit

  packages:update:
    desc: Upgrade dependency versions and sync the development environment
    cmds:
      - uv lock --upgrade
      - uv sync --locked --group dev

  pre-commit:update:
    desc: Update pinned pre-commit hook versions
    cmds:
      - uv run --group dev pre-commit autoupdate

  pre-commit:install:
    desc: Install the pre-commit Git hook
    cmds:
      - uv run --group dev pre-commit install

  ty:
    desc: Check Python types with ty
    cmds:
      - uv run --group dev ty check

  ruff:check:
    desc: Check Python lint rules and formatting with Ruff
    cmds:
      - uv run --group dev ruff check .
      - uv run --group dev ruff format --check .

  ruff:fix:
    desc: Apply safe automatic Ruff fixes
    cmds:
      - uv run --group dev ruff check --fix .
  
  ruff:format:
    desc: Apply safe automatic Ruff formatting
    cmds:
      - uv run --group dev ruff format .

  uv:audit:
    desc: Check dependencies for known vulnerabilities with uv
    cmds:
      - uv audit --preview-features audit-command
  
  run:module_00:
    desc: Run the main script for module 00
    cmds:
      - uv run --env-file .env python -m agents_lab.module_00.main

  run:module_01:
    desc: Run the main script for module 01
    cmds:
      - uv run --env-file .env python -m agents_lab.module_01.main

  run:module_02:
    desc: Run the main script for module 02
    cmds:
      - uv run --env-file .env python -m agents_lab.module_02.main

  run:module_03:
    desc: Run the main script for module 03
    cmds:
      - uv run --env-file .env python -m agents_lab.module_03.main

  run:module_04:
    desc: Run the main script for module 04
    cmds:
      - uv run --env-file .env python -m agents_lab.module_04.main

  run:module_05:
    desc: Run the main script for module 05
    cmds:
      - uv run --env-file .env python -m agents_lab.module_05.main
