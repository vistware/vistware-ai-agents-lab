[project]
name = "agents-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Przemysław Różycki", email = "przemyslaw.rozycki@vistware.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.42.0",
    "pydantic>=2.14.2",
    "pydantic-ai>=2.64.0",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]

[tool.hatch.build.targets.wheel]
packages = ["agents_lab"]

[project.scripts]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""


[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
branch = true
source = ["agents_lab"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
